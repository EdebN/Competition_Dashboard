<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Score Entry Portal</title>
<style>
:root{color-scheme:dark;--bg:#0c0d10;--panel:#15171c;--line:#2b2e36;--text:#f4f0e7;--muted:#a4a7af;--gold:#d8b45a;--good:#69d2a1;--bad:#ff8888}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at 15% 0%,#29251b 0,transparent 42%),var(--bg);color:var(--text);font:16px/1.5 system-ui,-apple-system,sans-serif;min-height:100vh}
main{width:min(760px,calc(100% - 32px));margin:48px auto}header{margin-bottom:28px}.back-dashboard{display:inline-flex;align-items:center;gap:8px;min-height:40px;margin-bottom:25px;padding:10px 13px;border:1px solid #393d47;border-radius:10px;background:#15171c;color:var(--text);font-size:10px;font-weight:900;letter-spacing:.07em;text-decoration:none;transition:background .16s,border-color .16s,transform .16s}.back-dashboard:hover{background:#20242b;border-color:#6d5b30;transform:translateX(-2px)}.back-dashboard:focus-visible{outline:2px solid var(--gold);outline-offset:3px}.eyebrow{color:var(--gold);font-size:12px;font-weight:800;letter-spacing:.16em;text-transform:uppercase}h1{font-size:clamp(30px,6vw,48px);line-height:1.05;letter-spacing:-.04em;margin:10px 0}p{color:var(--muted)}.panel{background:rgba(21,23,28,.94);border:1px solid var(--line);border-radius:18px;padding:clamp(18px,4vw,28px);margin:18px 0;box-shadow:0 18px 60px #0003}.field{display:grid;gap:7px;margin:16px 0}label{font-size:12px;color:var(--muted);font-weight:800;letter-spacing:.08em;text-transform:uppercase}input,select{width:100%;background:#0e1014;border:1px solid #393d47;border-radius:10px;padding:13px 14px;color:var(--text);font:inherit;min-height:48px}input:focus,select:focus{outline:2px solid var(--gold);outline-offset:2px}.scores{display:grid;grid-template-columns:1fr 1fr;gap:14px}.score-input{font-size:28px;font-weight:750;text-align:center}.button{background:var(--gold);border:0;border-radius:10px;color:#19160e;font:800 13px system-ui,sans-serif;letter-spacing:.06em;padding:15px 18px;min-height:48px;cursor:pointer}.button:disabled{opacity:.55;cursor:wait}.button.secondary{background:transparent;color:var(--text);border:1px solid var(--line)}.status{min-height:24px;margin-top:14px;font-size:14px;color:var(--muted);overflow-wrap:anywhere}.status.good{color:var(--good)}.status.bad{color:var(--bad)}.completion{display:flex;align-items:center;gap:9px;margin:10px 0 16px;padding:11px 13px;border:1px solid var(--line);border-radius:10px;background:#101216;font-size:13px;font-weight:800}.completion-dot{width:9px;height:9px;border-radius:50%;background:#a4a7af;flex:none}.completion.done{color:var(--good);border-color:#315a49}.completion.done .completion-dot{background:var(--good);box-shadow:0 0 12px #69d2a155}.completion.pending{color:#e2c578}.completion.pending .completion-dot{background:#e2c578}.hidden{display:none!important}.row{display:flex;gap:12px;align-items:center;flex-wrap:wrap}.row .button{flex:1}.small{font-size:12px;color:var(--muted)}footer{margin-top:30px;font-size:12px;color:var(--muted)}@media(max-width:520px){main{margin:28px auto}.scores{gap:9px}.panel{border-radius:14px}}
</style>
</head>
<body>
<main>
<header><a class="back-dashboard" href="index.html">← BACK TO COMPETITION DASHBOARD</a><div class="eyebrow">Competition · Operations</div><h1>Score entry</h1></header>
<section class="panel" id="loginPanel">
<h2>Sign in</h2>
<div class="field"><label for="code">Password</label><input id="code" type="password" autocomplete="current-password" placeholder="Enter password"></div>
<button class="button" id="unlock">UNLOCK SCORE ENTRY</button><div class="status" id="loginStatus" role="status" aria-live="polite"></div>
</section>
<section class="panel hidden" id="entryPanel">
<div class="row"><h2 style="margin:0;flex:1">Official result</h2><button class="button secondary" id="lock" type="button">LOCK PORTAL</button></div>
<div class="field"><label for="fixture">Fixture</label><select id="fixture"><option value="">Loading fixtures…</option></select></div>
 <div class="completion pending" id="completionStatus" role="status" aria-live="polite"><span class="completion-dot"></span><span id="completionText">Select a match to see its status.</span></div>
<div class="scores">
<div class="field"><label id="homeLabel" for="homeScore">Home score</label><input class="score-input" id="homeScore" type="number" min="0" max="99" step="1" inputmode="numeric" placeholder="0"></div>
<div class="field"><label id="awayLabel" for="awayScore">Away score</label><input class="score-input" id="awayScore" type="number" min="0" max="99" step="1" inputmode="numeric" placeholder="0"></div>
</div>
<div class="row"><button class="button" id="save">SAVE OFFICIAL RESULT</button><button class="button secondary" id="refresh" type="button">REFRESH DATA</button></div>
<div class="status" id="saveStatus" role="status" aria-live="polite"></div>

</section>

</main>
<script>
"use strict";
const API_URL = "https://script.google.com/macros/s/AKfycbzpSMWXldQh4dDUKUK4QTnE2sIn1tJJJDii_UrdkBV9uE0r1L933fRm76dbY1_LWrrj/exec";
const CSV_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vT2tLmAB4OB6uWLeBeCSWLMarzK9RjelvVTJRGqsm94yVijiT25leyXnPWhJybPtoyMKUgfBL6tTzFe/pub?output=csv";
let scoreSessionToken = "";
let fixtures = [];
let savedResults = [];
 let displayNames = Object.fromEntries(["A","B","C","D","E"].map(id=>["Team "+id,"Team "+id]));
 function displayTeam(team){return displayNames[team]||team;}
const $ = id => document.getElementById(id);
function status(id, message, kind="") { const el=$(id); el.textContent=message; el.className="status"+(kind?" "+kind:""); }
function post(payload) { return fetch(API_URL,{method:"POST",mode:"no-cors",headers:{"Content-Type":"text/plain;charset=UTF-8"},body:JSON.stringify(payload)}); }
function get(action, params={}) {
 return new Promise((resolve,reject)=>{
  const callback="scorePortalCb"+Math.random().toString(36).slice(2);
  const url=new URL(API_URL);url.searchParams.set("action",action);url.searchParams.set("callback",callback);url.searchParams.set("_",String(Date.now()));
  Object.entries(params).forEach(([k,v])=>url.searchParams.set(k,String(v)));
  const script=document.createElement("script");let done=false;
  const finish=(err,value)=>{if(done)return;done=true;delete window[callback];script.remove();err?reject(err):resolve(value);};
  window[callback]=value=>finish(null,value);script.onerror=()=>finish(new Error("Could not reach Apps Script."));script.src=url.toString();document.head.appendChild(script);
  setTimeout(()=>finish(new Error("Request timed out.")),10000);
 });
}
function parseCSV(text){
 const rows=[];let row=[],value="",quoted=false;
 for(let i=0;i<text.length;i++){const c=text[i],n=text[i+1];if(c==='"'&&quoted&&n==='"'){value+='"';i++;continue;}if(c==='"'){quoted=!quoted;continue;}if((c==="\n"||c==="\r")&&!quoted){if(c==="\r"&&n==="\n")i++;row.push(value);if(row.some(v=>v.trim()))rows.push(row);row=[];value="";continue;}if(c===", "&&!quoted){row.push(value);value="";continue;}if(c===","&&!quoted){row.push(value);value="";continue;}value+=c;}
 if(value!==""||row.length){row.push(value);if(row.some(v=>v.trim()))rows.push(row);}return rows;
}
// Keep finals seeding aligned with script.js: the dashboard's Glicko-2
// rating calculation, including its rating-period grouping and margin weights.
const RATING={start:1000,initialRD:203.57,initialVolatility:0.0894,tau:0.5638,epsilon:0.000001,scale:173.7178};
function ratingState(rating,rd,volatility){return{rating,rd,volatility,mu:(rating-RATING.start)/RATING.scale,phi:rd/RATING.scale};}
function ratingFromState(state){return{rating:RATING.start+state.mu*RATING.scale,rd:state.phi*RATING.scale,volatility:state.volatility,mu:state.mu,phi:state.phi};}
function ratingG(phi){return 1/Math.sqrt(1+3*phi*phi/(Math.PI*Math.PI));}
function ratingExpected(mu,opponentMu,opponentPhi){const g=ratingG(opponentPhi);return 1/(1+Math.exp(-g*(mu-opponentMu)));}
function ratingVolatility(phi,sigma,delta,variance){
 const a=Math.log(sigma*sigma),tauSquared=RATING.tau*RATING.tau;
 const f=x=>{const expX=Math.exp(x),numerator=expX*(delta*delta-phi*phi-variance-expX),denominator=2*Math.pow(phi*phi+variance+expX,2);return numerator/denominator-(x-a)/tauSquared;};
 let A=a,B;
 if(delta*delta>phi*phi+variance)B=Math.log(delta*delta-phi*phi-variance);
 else{let k=1;B=a-k*RATING.tau;while(f(B)<0&&k<100){k++;B=a-k*RATING.tau;}}
 let fA=f(A),fB=f(B),iterations=0;
 while(Math.abs(B-A)>RATING.epsilon&&iterations<100){const C=A+((A-B)*fA)/(fB-fA),fC=f(C);if(fC*fB<0){A=B;fA=fB;}else fA/=2;B=C;fB=f(B);iterations++;}
 return Math.exp(A/2);
}
function updateRatingPeriod(state,results){
 const phi=state.phi,sigma=state.volatility;
 if(!results.length)return ratingFromState({mu:state.mu,phi:Math.sqrt(phi*phi+sigma*sigma),volatility:sigma});
 let sumVariance=0,sumResidual=0;
 results.forEach(result=>{const g=ratingG(result.opponent.phi),expected=ratingExpected(state.mu,result.opponent.mu,result.opponent.phi),weight=result.weight??1;sumVariance+=weight*g*g*expected*(1-expected);sumResidual+=weight*g*(result.score-expected);});
 if(sumVariance<=0)return ratingFromState({mu:state.mu,phi:Math.sqrt(phi*phi+sigma*sigma),volatility:sigma});
 const variance=1/sumVariance,delta=variance*sumResidual,newVolatility=ratingVolatility(phi,sigma,delta,variance),phiStar=Math.sqrt(phi*phi+newVolatility*newVolatility),newPhi=1/Math.sqrt(1/(phiStar*phiStar)+1/variance),newMu=state.mu+newPhi*newPhi*sumResidual;
 return ratingFromState({mu:newMu,phi:newPhi,volatility:newVolatility});
}
function dashboardRatings(activeGames,resultsById){
 const states={},stats={};
 ["Team A","Team B","Team C","Team D","Team E"].forEach(team=>{states[team]=ratingState(RATING.start,RATING.initialRD,RATING.initialVolatility);stats[team]={team,wins:0,draws:0,losses:0,pf:0,pa:0,diff:0};});
 for(let start=0;start<activeGames.length;start+=2){
  const round=activeGames.slice(start,start+2),pre={};Object.keys(states).forEach(team=>pre[team]={...states[team]});
  const byTeam={};Object.keys(states).forEach(team=>byTeam[team]=[]);
  round.forEach(game=>{
   const result=resultsById.get(game.id);if(!result||result.homeScore==null||result.awayScore==null||result.homeScore===""||result.awayScore===""||!game.home||!game.away)return;
   const homeScore=Number(result.homeScore),awayScore=Number(result.awayScore);if(!Number.isFinite(homeScore)||!Number.isFinite(awayScore))return;
   const outcome=homeScore>awayScore?1:homeScore<awayScore?0:0.5,margin=homeScore===awayScore?1:Math.max(0,Math.min(4,Math.log(Math.abs(homeScore-awayScore)+1)*1.6/1.8));
   byTeam[game.home].push({opponent:pre[game.away],score:outcome,weight:margin});
   byTeam[game.away].push({opponent:pre[game.home],score:1-outcome,weight:margin});
   const h=stats[game.home],a=stats[game.away];h.pf+=homeScore;h.pa+=awayScore;a.pf+=awayScore;a.pa+=homeScore;
   if(homeScore>awayScore){h.wins++;a.losses++;}else if(homeScore<awayScore){a.wins++;h.losses++;}else{h.draws++;a.draws++;}
  });
  Object.keys(states).forEach(team=>states[team]=updateRatingPeriod(pre[team],byTeam[team]));
 }
 Object.keys(stats).forEach(team=>{stats[team].diff=stats[team].pf-stats[team].pa;stats[team].elo=states[team].rating;});
 return Object.values(stats).sort((a,b)=>b.elo-a.elo||b.diff-a.diff||b.wins-a.wins||b.pf-a.pf);
}
async function loadData(){
 status("saveStatus","Loading matches…");
 const [csvResponse,resultResponse,settingsResponse,teamSettingsResponse]=await Promise.all([
  fetch(CSV_URL+"&cacheBust="+Date.now()).then(r=>{if(!r.ok)throw new Error("Fixture sheet could not be loaded.");return r.text();}),
  get("getMatchResults"),
  get("getCompetitionSettings").catch(()=>null),
  get("getTeamSettings").catch(()=>null)
 ]);
 const rows=parseCSV(csvResponse);if(rows.length<2)throw new Error("No fixtures were found in the published CSV.");
 const allRows=rows.slice(1).map(r=>({id:Number(String(r[0]||"").trim()),home:String(r[1]||"").trim(),homeScore:r[2],away:String(r[3]||"").trim(),awayScore:r[4],stage:String(r[5]||"REGULAR").trim().toUpperCase()})).filter(f=>Number.isInteger(f.id));
 if(!resultResponse?.ok||!Array.isArray(resultResponse.results))throw new Error("Could not load results.");
 savedResults=resultResponse.results;
  if(teamSettingsResponse?.ok&&Array.isArray(teamSettingsResponse.teams)){
   teamSettingsResponse.teams.forEach(team=>{const id=String(team.teamId||"").toUpperCase();const name=String(team.displayName||"").trim();if(/^[A-E]$/.test(id)&&name)displayNames["Team "+id]=name;});
  }
 const perTeam=Number(settingsResponse?.gamesPerTeam);
 const gamesPerTeam=Number.isInteger(perTeam)&&perTeam>=3&&perTeam<=32?perTeam:16;
 const activeRegularCount=gamesPerTeam*5/2;
 const regular=allRows.filter(f=>(f.stage||"REGULAR")==="REGULAR"&&f.home&&f.away).sort((a,b)=>a.id-b.id).slice(0,activeRegularCount);
 const finals=allRows.filter(f=>f.stage==="FINAL"||f.stage==="GRAND FINAL").sort((a,b)=>a.id-b.id);
 const resultsById=new Map(savedResults.map(r=>[Number(r.matchId),r]));
 // Use the same Glicko-2 engine and ladder tie-breaks as the live dashboard.
 const standings=dashboardRatings(regular,resultsById);
 // Finals follow the dashboard bracket: #1 v #4 and #2 v #3, then winners/losers.
 const opening=finals.filter(f=>f.stage==="FINAL");
 const final1=opening[0],final2=opening[1],final3=opening[2];
 const grand=finals.find(f=>f.stage==="GRAND FINAL");
 const resultFor=f=>f&&resultsById.get(f.id);
 const ratingByTeam=new Map(standings.map(team=>[team.team,team.elo]));
 const winner=f=>{const r=resultFor(f);if(!f||!r||r.homeScore==null||r.awayScore==null||r.homeScore===""||r.awayScore==="")return "";const h=Number(r.homeScore),a=Number(r.awayScore);if(h===a)return (ratingByTeam.get(f.home)??0)>=(ratingByTeam.get(f.away)??0)?f.home:f.away;return h>a?f.home:f.away;};
 const loser=f=>{const w=winner(f);return !w?"":w===f.home?f.away:f.home;};
 const finalFixtures=[];
 if(final1&&standings.length>=4)finalFixtures.push({...final1,home:standings[0].team,away:standings[3].team});
 if(final2&&standings.length>=4)finalFixtures.push({...final2,home:standings[1].team,away:standings[2].team});
 const f1=finalFixtures.find(f=>f.id===final1?.id),f2=finalFixtures.find(f=>f.id===final2?.id);
 if(grand&&f1&&f2&&winner(f1)&&winner(f2))finalFixtures.push({...grand,home:winner(f1),away:winner(f2)});
 if(final3&&f1&&f2&&loser(f1)&&loser(f2))finalFixtures.push({...final3,home:loser(f1),away:loser(f2)});
 fixtures=[...regular,...finalFixtures].filter(f=>f.home&&f.away);
 const select=$("fixture"),previous=select.value;select.innerHTML="";
 fixtures.forEach(f=>{const o=document.createElement("option");o.value=String(f.id);o.textContent=fixtureLabel(f);select.appendChild(o);});
 if(previous&&fixtures.some(f=>String(f.id)===previous))select.value=previous;
 fillScores();status("saveStatus","Matches loaded.","good");
}
function selectedFixture(){return fixtures.find(f=>f.id===Number($("fixture").value));}
function savedFor(id){return savedResults.find(r=>Number(r.matchId)===id);}
function isCompleted(f){const r=f&&savedFor(f.id);return Boolean(r&&r.homeScore!==null&&r.homeScore!==""&&r.awayScore!==null&&r.awayScore!=="");}
function fixtureLabel(f){return (f.stage==="REGULAR"?"Game "+f.id:f.stage+" · Game "+f.id)+" · "+displayTeam(f.home)+" vs "+displayTeam(f.away)+" · "+(isCompleted(f)?"COMPLETED":"NOT COMPLETED");}
function refreshFixtureLabels(){const select=$("fixture");Array.from(select.options).forEach(o=>{const f=fixtures.find(item=>String(item.id)===o.value);if(f)o.textContent=fixtureLabel(f);});}
function updateCompletionStatus(f){
 const el=$("completionStatus"),label=$("completionText");
 if(!f){el.className="completion pending";label.textContent="Select a match to see its status.";return;}
 const done=isCompleted(f);el.className="completion "+(done?"done":"pending");
 label.textContent=done?"MATCH COMPLETED · Official score: "+savedFor(f.id).homeScore+"–"+savedFor(f.id).awayScore:"MATCH NOT COMPLETED · No official result saved";
}
function fillScores(){
 const f=selectedFixture();if(!f){updateCompletionStatus(null);return;}
 $("homeLabel").textContent=displayTeam(f.home)+" score";$("awayLabel").textContent=displayTeam(f.away)+" score";
 const r=savedFor(f.id);
 $("homeScore").value=r&&r.homeScore!==null&&r.homeScore!==""?r.homeScore:"";
 $("awayScore").value=r&&r.awayScore!==null&&r.awayScore!==""?r.awayScore:"";
 updateCompletionStatus(f);
 status("saveStatus",isCompleted(f)?"Current official score: "+r.homeScore+"–"+r.awayScore+".":"No official result recorded for this fixture.");
}
async function unlock(){
 const code=$("code").value;
 if(!code){status("loginStatus","Enter your password.","bad");return;}
 $("unlock").disabled=true;status("loginStatus","Verifying password…");
 const nonce=Array.from(crypto.getRandomValues(new Uint8Array(24))).map(b=>b.toString(16).padStart(2,"0")).join("");
 try{
  await post({action:"createScoreEditorSession",scoreEditorCode:code,nonce});
  let session=null;
  for(let i=0;i<8;i++){await new Promise(r=>setTimeout(r,350));try{session=await get("getScoreEditorSession",{nonce});if(session?.ok&&session.sessionToken)break;}catch{}}
  if(!session?.ok||!session.sessionToken)throw new Error("Could not sign in. Check your password and try again.");
  scoreSessionToken=session.sessionToken;$("loginPanel").classList.add("hidden");$("entryPanel").classList.remove("hidden");
  try{await loadData();}catch{status("saveStatus","Could not load matches. Refresh and try again.","bad");}
 }catch(e){scoreSessionToken="";status("loginStatus","Could not sign in. Check your password and try again.","bad");}
 finally{$("unlock").disabled=false;}
}
async function save(){
 const f=selectedFixture(),h=$("homeScore").value,a=$("awayScore").value;
 if(!scoreSessionToken){status("saveStatus","Session expired. Unlock the portal again.","bad");return;}
 if(!f){status("saveStatus","Choose a fixture first.","bad");return;}
 if(h===""||a===""||!Number.isInteger(Number(h))||!Number.isInteger(Number(a))||Number(h)<0||Number(a)<0||Number(h)>99||Number(a)>99){status("saveStatus","Enter whole-number scores from 0 to 99.","bad");return;}
 if(!confirm("Save Game "+f.id+": "+displayTeam(f.home)+" "+h+"–"+a+" "+displayTeam(f.away)+"? This changes the official result."))return;
 $("save").disabled=true;status("saveStatus","Saving score…");
 try{
  await post({action:"submitMatchResult",scoreSessionToken,matchId:f.id,homeScore:Number(h),awayScore:Number(a)});
  let verified=null;
  for(let i=0;i<8;i++){await new Promise(r=>setTimeout(r,500));try{const response=await get("getMatchResults");verified=response?.ok&&Array.isArray(response.results)?response.results.find(r=>Number(r.matchId)===f.id):null;if(verified&&Number(verified.homeScore)===Number(h)&&Number(verified.awayScore)===Number(a))break;}catch{}}
  if(!verified||Number(verified.homeScore)!==Number(h)||Number(verified.awayScore)!==Number(a))throw new Error("Could not confirm the save. Refresh before trying again.");
  savedResults=savedResults.filter(r=>Number(r.matchId)!==f.id);savedResults.push(verified);refreshFixtureLabels();updateCompletionStatus(f);
  status("saveStatus","Score saved.","good");
 }catch(e){status("saveStatus",e.message==="Could not confirm the save. Refresh before trying again."?e.message:"Could not save score. Refresh and try again.","bad");}
 finally{$("save").disabled=false;}
}
function lock(){scoreSessionToken="";sessionStorage.removeItem("score-entry-session-token");$("code").value="";$("entryPanel").classList.add("hidden");$("loginPanel").classList.remove("hidden");status("loginStatus","Portal locked.");}
$("unlock").addEventListener("click",unlock);$("code").addEventListener("keydown",e=>{if(e.key==="Enter")unlock();});$("fixture").addEventListener("change",fillScores);$("save").addEventListener("click",save);$("refresh").addEventListener("click",()=>loadData().catch(()=>status("saveStatus","Could not load matches. Refresh and try again.","bad")));$("lock").addEventListener("click",lock);
const gatewaySession=sessionStorage.getItem("score-entry-session-token");
if(/^[a-f0-9]{64}$/.test(gatewaySession||"")){
 sessionStorage.removeItem("score-entry-session-token");scoreSessionToken=gatewaySession;
 $("loginPanel").classList.add("hidden");$("entryPanel").classList.remove("hidden");
 loadData().catch(()=>status("saveStatus","Signed in, but match data could not be loaded. Refresh and try again.","bad"));
}
</script>
<script src="team-names.js"></script>
<script src="image-editor.js"></script>
</body>
</html>
